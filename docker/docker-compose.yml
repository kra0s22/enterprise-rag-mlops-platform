services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      RAG_ENVIRONMENT: production
      RAG_VECTOR_STORE_PROVIDER: qdrant
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow

  # Optional backend; enable with: docker compose --profile milvus up
  milvus:
    image: milvusdb/milvus:v2.4.13
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: "local"
    ports:
      - "19530:19530"
    volumes:
      - milvus_storage:/var/lib/milvus

volumes:
  qdrant_storage:
  mlflow_artifacts:
  milvus_storage:
