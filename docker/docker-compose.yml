services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    # The qdrant image ships without curl; probe the REST port with bash /dev/tcp.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      RAG_ENVIRONMENT: production
      RAG_VECTOR_STORE_PROVIDER: qdrant
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      RAG_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    # Persist the metadata store (sqlite) and artifacts inside the named volume,
    # otherwise a `docker compose down` loses every logged experiment.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow

  # Optional backend; enable with: docker compose --profile milvus up
  milvus:
    image: milvusdb/milvus:v2.4.13
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: "local"
    ports:
      - "19530:19530"
    volumes:
      - milvus_storage:/var/lib/milvus

volumes:
  qdrant_storage:
  mlflow_artifacts:
  milvus_storage:
