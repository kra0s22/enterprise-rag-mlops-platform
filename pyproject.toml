[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Enterprise-grade Production RAG system: PySpark ingestion, hybrid vector search, Ragas evaluation, and MLflow tracking."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "RAG Platform Team" }]
keywords = ["rag", "mlops", "pyspark", "vector-search", "fastapi", "mlflow", "qdrant", "milvus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyspark>=3.5.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.10.0",
    "pymilvus>=2.4.0",
    "numpy>=1.26.0",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Heavy evaluation stack, kept out of the serving image to keep it lean.
# ragas is pinned <0.3 and langchain-community <0.4: newer ragas versions import
# langchain_community.chat_models.vertexai, which was removed in langchain-community 0.4.
eval = [
    "ragas>=0.2.0,<0.3",
    "langchain-community>=0.3.0,<0.4",
    "mlflow>=2.15.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
all = [
    "ragas>=0.2.0,<0.3",
    "langchain-community>=0.3.0,<0.4",
    "mlflow>=2.15.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
rag-api = "rag_platform.api.main:run"
rag-ingest = "rag_platform.ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [".conda", ".git", ".venv", "build", "dist", ".mypy_cache", ".ruff_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
