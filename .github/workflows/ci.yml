name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: rag-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: docker run --rm rag-platform-api:ci python -c "from rag_platform.api.main import app; assert app.title == 'RAG Platform API'"

  real-evaluation:
    runs-on: ubuntu-latest
    # Manual, on-demand evaluation against the versioned dataset; needs a judge
    # LLM API key, so the job skips cleanly when the secret is not configured.
    if: github.event_name == 'workflow_dispatch' && secrets.OPENAI_API_KEY != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the evaluation stack
        run: pip install -e ".[eval]"

      - name: Run the Ragas evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m rag_platform.evaluation.ragas_eval --dataset data/eval_set.jsonl
